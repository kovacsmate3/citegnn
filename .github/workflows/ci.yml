# Mirrors the two jobs in .gitlab-ci.yml. CPU PyTorch wheels come from uv.lock.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m compileall -q src scripts
      - run: uv run mypy src scripts

  python_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: PYTHONPATH=src uv run coverage run -m unittest discover -s tests -v
      - run: uv run coverage report
